services:
  mongodb:
    image: mongo:7
    container_name: insight_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: insight
    volumes:
      - mongodb_data:/data/db
    networks:
      - insight-internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insight_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=${DATABASE_NAME:-insight}
      - WEB_CONCURRENCY=1
    ports:
      - "3003:8001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - insight-internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insight_frontend
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - insight-internal
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

volumes:
  mongodb_data:
    driver: local
    name: insight_mongodb_data

networks:
  insight-internal:
    driver: bridge
    name: insight-internal