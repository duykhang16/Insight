name: Auto Deploy INSIGHT

on:
  release:
    types: [published]

env:
  PROJECT_DIR: /home/cuong-deploy/Insight
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_BUILDKIT: 1

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Pull latest code
        run: |
          cd ${{ env.PROJECT_DIR }}
          git fetch --all --prune
          git reset --hard origin/main
          git log -1 --oneline

      - name: Verify environment
        run: |
          cd ${{ env.PROJECT_DIR }}
          docker --version
          docker compose version
          if [ ! -f .env ]; then
            echo "ERROR: .env file not found"
            exit 1
          fi
          df -h / | tail -1

      - name: Build and deploy
        run: |
          cd ${{ env.PROJECT_DIR }}
          docker compose up -d --build --remove-orphans
          docker compose ps

      - name: Health check
        run: |
          cd ${{ env.PROJECT_DIR }}

          echo "Checking MongoDB..."
          for i in $(seq 1 12); do
            if docker exec insight_mongodb mongosh --eval "db.adminCommand('ping').ok" --quiet 2>/dev/null; then
              echo "MongoDB OK"
              break
            fi
            [ $i -eq 12 ] && echo "MongoDB FAILED" && docker logs insight_mongodb --tail 20 && exit 1
            sleep 5
          done

          echo "Checking Backend..."
          for i in $(seq 1 12); do
            if curl -sf http://localhost:3003/health > /dev/null 2>&1; then
              echo "Backend OK"
              break
            fi
            [ $i -eq 12 ] && echo "Backend FAILED" && docker logs insight_backend --tail 30 && exit 1
            sleep 5
          done

          echo "Checking Frontend..."
          for i in $(seq 1 6); do
            if curl -sf http://localhost:3002/ > /dev/null 2>&1; then
              echo "Frontend OK"
              break
            fi
            [ $i -eq 6 ] && echo "Frontend FAILED" && docker logs insight_frontend --tail 20 && exit 1
            sleep 5
          done

      - name: Cleanup
        run: |
          docker image prune -f
          df -h / | tail -1
          docker compose -f ${{ env.PROJECT_DIR }}/docker-compose.yml ps
          echo "Deploy complete: ${{ github.event.release.tag_name }}"
