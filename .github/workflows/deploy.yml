name: Auto Deploy INSIGHT

# Kịch bản này sẽ tự động chạy khi tạo một bản "Release" mới trên GitHub
on:
  release:
    types: [published]

jobs:
  deploy:
    # Chỉ định chạy trên con Runner mà anh sắp cài đặt trên Ubuntu
    runs-on: self-hosted 
    
    steps:
      - name: Deploy Code
        run: |
          # Di chuyển vào thư mục dự án
          cd /home/cuong-deploy/Insight
          
          # 2. Xóa bỏ mọi thay đổi phát sinh trên server để tránh lỗi khi cập nhật code
          # Điều này giúp lệnh pull luôn mượt mà
          git reset --hard origin/main
          
          # 3. Kéo code mới nhất từ nhánh main của GitHub về VPS
          git pull origin main
          
          # 4. Restart Docker daemon để fix lỗi runc (can't get final child's PID)
          # Container có restart policy "unless-stopped" sẽ tự lên lại
          echo "=== Restarting Docker daemon ==="
          sudo systemctl restart docker
          sleep 15
          echo "=== Docker restarted, checking containers ==="
          docker ps
          
          # 5. Dọn dẹp toàn bộ Docker không dùng (images, containers, build cache)
          docker system prune -af
          docker builder prune -af
          
          # 5.5 Kiểm tra dung lượng ổ đĩa trước khi build
          echo "=== Disk usage before build ==="
          df -h /
          
          # 6. Yêu cầu Docker dựng lại (Build) các Image mới và khởi chạy container
          docker compose up -d --build
          
          # 7. Kết nối container MongoDB (chạy bên ngoài) vào mạng insight-net
          # để backend có thể resolve hostname "MongoDB"
          docker network connect insight-net MongoDB || true
          
          # 8. Restart backend sau khi MongoDB đã join network
          docker restart insight_backend
          
          # 9. Xóa bỏ các bản build cũ (dangling images) để tiết kiệm 30GB SSD của VPS
          docker image prune -f
